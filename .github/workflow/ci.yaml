name: CI pipeline

on:
  push:
    branches:
      - "**" # matches every branch
      
jobs:
  lint:
    name: checkout
    runs-on: ubuntu-20.04

    steps:
      - name: checkout
        uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        with:
          python-version: "3.12.1"

      - name: install dependencies
        run: pip install -r dev-requirements.txt

      - name: Running isort.
        run: isort --check-only  ./compute-service/lambda/functions/

      - name: Running flake8
        run: flake8 ./compute-service/lambda/functions/